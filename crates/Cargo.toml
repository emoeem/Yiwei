# Reader Platform Rust Core.
#
# This is a nested workspace, deliberately excluded from the readest workspace in
# the repository root (see `exclude` there). Two reasons:
#
#   1. The upstream `Cargo.toml` stays almost untouched, so `git rebase
#      upstream/main` keeps working (ADR-0007).
#   2. These crates are edition 2024 with their own lint set and lockfile, while
#      the Tauri shell is edition 2021 and pins its deps through `Cargo.cef.lock`.
#
# Build and test from this directory:
#   cargo test --offline
#   cargo clippy --offline --all-targets

[workspace]
resolver = "3"
# Explicit list, not ["*"]: a glob would also match the `target/` directory that
# cargo creates here after the first build, and fail to load it as a manifest.
members = [
  "annotation",
  "document",
  "protocol",
  "reader-model",
  "storage",
  "sync",
  "wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "AGPL-3.0"

# Workspace dependency set is pinned to versions available in the offline
# registry cache; Cargo.lock is committed for reproducibility.
[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
sha2 = "0.10.9"
uuid = { version = "1.26.0", features = ["v4", "v7", "serde", "js"] }
quick-xml = "0.41.0"
flate2 = "1.1.5"
encoding_rs = "0.8.35"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"
unicode-normalization = "0.1.25"
rusqlite = { version = "0.38.0", features = ["bundled"] }
hex = "0.4.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }

reader-model = { path = "reader-model" }
reader-sync = { path = "sync" }
reader-annotation = { path = "annotation" }
reader-document = { path = "document" }
reader-storage = { path = "storage" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
